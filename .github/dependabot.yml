version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # Newer Aliyun SDK releases cap cryptography below this project's
      # audited >=50 security floor. Upgrade these SDK pins together only
      # after the upstream constraint is compatible.
      - dependency-name: alibabacloud-dm20151123
      - dependency-name: alibabacloud-tea-openapi
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Shanghai
    groups:
      actions-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
