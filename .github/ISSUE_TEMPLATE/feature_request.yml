name: 功能建议
description: 提议新的用户能力、场景、规则、文档或工程改进。
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述用户现在卡在哪里，不要只描述想加入的实现。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明预期交互、输入输出和能力边界。
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 法律或数据来源
      description: 涉及法条、规则或新场景时，请附权威来源；其他建议可填“不适用”。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 给出可以测试或观察的完成条件。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我使用的是虚构示例，没有提交真实用户资料或密钥。
          required: true
