- law_name: 中华人民共和国民法典
  law_short: 民法典
  article_no: 第四百九十六条
  article_num: 496
  content: |-
    第四百九十六条　格式条款是当事人为了重复使用而预先拟定，并在订立合同时未与对方协商的条款。
    采用格式条款订立合同的，提供格式条款的一方应当遵循公平原则确定当事人之间的权利和义务，并采取合理的方式提示对方注意免除或者减轻其责任等与对方有重大利害关系的条款，按照对方的要求，对该条款予以说明。提供格式条款的一方未履行提示或者说明义务，致使对方没有注意或者理解与其有重大利害关系的条款的，对方可以主张该条款不成为合同的内容。
  chapter: 第二章　合同的订立
  effective_date: '2021-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff808081729d1efe01729d50b5c500bf
- law_name: 中华人民共和国民法典
  law_short: 民法典
  article_no: 第四百九十七条
  article_num: 497
  content: |-
    第四百九十七条　有下列情形之一的，该格式条款无效：
    （一）具有本法第一编第六章第三节和本法第五百零六条规定的无效情形；
    （二）提供格式条款一方不合理地免除或者减轻其责任、加重对方责任、限制对方主要权利；
    （三）提供格式条款一方排除对方主要权利。
  chapter: 第二章　合同的订立
  effective_date: '2021-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff808081729d1efe01729d50b5c500bf
- law_name: 中华人民共和国民法典
  law_short: 民法典
  article_no: 第五百零九条
  article_num: 509
  content: |-
    第五百零九条　当事人应当按照约定全面履行自己的义务。
    当事人应当遵循诚信原则，根据合同的性质、目的和交易习惯履行通知、协助、保密等义务。
    当事人在履行合同过程中，应当避免浪费资源、污染环境和破坏生态。
  chapter: 第四章　合同的履行
  effective_date: '2021-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff808081729d1efe01729d50b5c500bf
- law_name: 中华人民共和国民法典
  law_short: 民法典
  article_no: 第五百六十三条
  article_num: 563
  content: |-
    第五百六十三条　有下列情形之一的，当事人可以解除合同：
    （一）因不可抗力致使不能实现合同目的；
    （二）在履行期限届满前，当事人一方明确表示或者以自己的行为表明不履行主要债务；
    （三）当事人一方迟延履行主要债务，经催告后在合理期限内仍未履行；
    （四）当事人一方迟延履行债务或者有其他违约行为致使不能实现合同目的；
    （五）法律规定的其他情形。
    以持续履行的债务为内容的不定期合同，当事人可以随时解除合同，但是应当在合理期限之前通知对方。
  chapter: 第七章　合同的权利义务终止
  effective_date: '2021-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff808081729d1efe01729d50b5c500bf
- law_name: 中华人民共和国民法典
  law_short: 民法典
  article_no: 第五百六十五条
  article_num: 565
  content: |-
    第五百六十五条　当事人一方依法主张解除合同的，应当通知对方。合同自通知到达对方时解除；通知载明债务人在一定期限内不履行债务则合同自动解除，债务人在该期限内未履行债务的，合同自通知载明的期限届满时解除。对方对解除合同有异议的，任何一方当事人均可以请求人民法院或者仲裁机构确认解除行为的效力。
    当事人一方未通知对方，直接以提起诉讼或者申请仲裁的方式依法主张解除合同，人民法院或者仲裁机构确认该主张的，合同自起诉状副本或者仲裁申请书副本送达对方时解除。
  chapter: 第七章　合同的权利义务终止
  effective_date: '2021-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff808081729d1efe01729d50b5c500bf
- law_name: 中华人民共和国民法典
  law_short: 民法典
  article_no: 第五百六十六条
  article_num: 566
  content: |-
    第五百六十六条　合同解除后，尚未履行的，终止履行；已经履行的，根据履行情况和合同性质，当事人可以请求恢复原状或者采取其他补救措施，并有权请求赔偿损失。
    合同因违约解除的，解除权人可以请求违约方承担违约责任，但是当事人另有约定的除外。
    主合同解除后，担保人对债务人应当承担的民事责任仍应当承担担保责任，但是担保合同另有约定的除外。
  chapter: 第七章　合同的权利义务终止
  effective_date: '2021-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff808081729d1efe01729d50b5c500bf
- law_name: 中华人民共和国民法典
  law_short: 民法典
  article_no: 第五百七十七条
  article_num: 577
  content: |-
    第五百七十七条　当事人一方不履行合同义务或者履行合同义务不符合约定的，应当承担继续履行、采取补救措施或者赔偿损失等违约责任。
  chapter: 第八章　违约责任
  effective_date: '2021-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff808081729d1efe01729d50b5c500bf
- law_name: 中华人民共和国民法典
  law_short: 民法典
  article_no: 第五百八十四条
  article_num: 584
  content: |-
    第五百八十四条　当事人一方不履行合同义务或者履行合同义务不符合约定，造成对方损失的，损失赔偿额应当相当于因违约所造成的损失，包括合同履行后可以获得的利益；但是，不得超过违约一方订立合同时预见到或者应当预见到的因违约可能造成的损失。
  chapter: 第八章　违约责任
  effective_date: '2021-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff808081729d1efe01729d50b5c500bf
- law_name: 中华人民共和国民法典
  law_short: 民法典
  article_no: 第五百八十五条
  article_num: 585
  content: |-
    第五百八十五条　当事人可以约定一方违约时应当根据违约情况向对方支付一定数额的违约金，也可以约定因违约产生的损失赔偿额的计算方法。
    约定的违约金低于造成的损失的，人民法院或者仲裁机构可以根据当事人的请求予以增加；约定的违约金过分高于造成的损失的，人民法院或者仲裁机构可以根据当事人的请求予以适当减少。
    当事人就迟延履行约定违约金的，违约方支付违约金后，还应当履行债务。
  chapter: 第八章　违约责任
  effective_date: '2021-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff808081729d1efe01729d50b5c500bf
- law_name: 中华人民共和国民法典
  law_short: 民法典
  article_no: 第七百一十条
  article_num: 710
  content: |-
    第七百一十条　承租人按照约定的方法或者根据租赁物的性质使用租赁物，致使租赁物受到损耗的，不承担赔偿责任。
  chapter: 第十四章　租赁合同
  effective_date: '2021-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff808081729d1efe01729d50b5c500bf
- law_name: 中华人民共和国民法典
  law_short: 民法典
  article_no: 第七百一十一条
  article_num: 711
  content: |-
    第七百一十一条　承租人未按照约定的方法或者未根据租赁物的性质使用租赁物，致使租赁物受到损失的，出租人可以解除合同并请求赔偿损失。
  chapter: 第十四章　租赁合同
  effective_date: '2021-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff808081729d1efe01729d50b5c500bf
- law_name: 中华人民共和国民法典
  law_short: 民法典
  article_no: 第七百一十三条
  article_num: 713
  content: |-
    第七百一十三条　承租人在租赁物需要维修时可以请求出租人在合理期限内维修。出租人未履行维修义务的，承租人可以自行维修，维修费用由出租人负担。因维修租赁物影响承租人使用的，应当相应减少租金或者延长租期。
    因承租人的过错致使租赁物需要维修的，出租人不承担前款规定的维修义务。
  chapter: 第十四章　租赁合同
  effective_date: '2021-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff808081729d1efe01729d50b5c500bf
- law_name: 中华人民共和国民法典
  law_short: 民法典
  article_no: 第七百一十四条
  article_num: 714
  content: |-
    第七百一十四条　承租人应当妥善保管租赁物，因保管不善造成租赁物毁损、灭失的，应当承担赔偿责任。
  chapter: 第十四章　租赁合同
  effective_date: '2021-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff808081729d1efe01729d50b5c500bf
- law_name: 中华人民共和国民法典
  law_short: 民法典
  article_no: 第七百三十三条
  article_num: 733
  content: |-
    第七百三十三条　租赁期限届满，承租人应当返还租赁物。返还的租赁物应当符合按照约定或者根据租赁物的性质使用后的状态。
  chapter: 第十四章　租赁合同
  effective_date: '2021-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff808081729d1efe01729d50b5c500bf
- law_name: 中华人民共和国民法典
  law_short: 民法典
  article_no: 第七百七十条
  article_num: 770
  content: |-
    第七百七十条　承揽合同是承揽人按照定作人的要求完成工作，交付工作成果，定作人支付报酬的合同。
    承揽包括加工、定作、修理、复制、测试、检验等工作。
  chapter: 第十七章　承揽合同
  effective_date: '2021-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff808081729d1efe01729d50b5c500bf
- law_name: 中华人民共和国民法典
  law_short: 民法典
  article_no: 第七百八十一条
  article_num: 781
  content: |-
    第七百八十一条　承揽人交付的工作成果不符合质量要求的，定作人可以合理选择请求承揽人承担修理、重作、减少报酬、赔偿损失等违约责任。
  chapter: 第十七章　承揽合同
  effective_date: '2021-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff808081729d1efe01729d50b5c500bf
- law_name: 中华人民共和国民法典
  law_short: 民法典
  article_no: 第七百八十七条
  article_num: 787
  content: |-
    第七百八十七条　定作人在承揽人完成工作前可以随时解除合同，造成承揽人损失的，应当赔偿损失。
  chapter: 第十七章　承揽合同
  effective_date: '2021-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff808081729d1efe01729d50b5c500bf
- law_name: 住房租赁条例
  law_short: 住房租赁条例
  article_no: 第十条
  article_num: 10
  content: |-
    第十条　出租人收取押金的，应当在住房租赁合同中约定押金的数额、返还时间以及扣减押金的情形等事项。除住房租赁合同约定的情形以外，出租人无正当理由不得扣减押金。
  chapter: 第二章　出租与承租
  effective_date: '2025-09-15'
  source_url: https://flk.npc.gov.cn/detail?id=ff808181983198da01983f9ff1be5b2c
- law_name: 住房租赁条例
  law_short: 住房租赁条例
  article_no: 第十一条
  article_num: 11
  content: |-
    第十一条　承租人应当遵守下列规定：
    （一）向出租人出示身份证明材料；
    （二）安全、合理使用租赁住房，不得损坏、擅自拆除、停用消防设施或者改动租赁住房承重结构，不得私拉乱接水、电、燃气管线；
    （三）未经出租人同意，不得擅自改变租赁住房用途、拆改室内设施或者改动租赁住房其他结构；
    （四）遵守物业管理规约，不得任意弃置垃圾、超标准排放污染物或者产生噪声、违反规定饲养动物、违章搭建、侵占公共通道、高空抛物或者实施其他损害他人合法权益的行为；
    （五）对出租人依法确需进入租赁住房的，予以配合。
  chapter: 第二章　出租与承租
  effective_date: '2025-09-15'
  source_url: https://flk.npc.gov.cn/detail?id=ff808181983198da01983f9ff1be5b2c
- law_name: 住房租赁条例
  law_short: 住房租赁条例
  article_no: 第三十五条
  article_num: 35
  content: |-
    第三十五条　在住房租赁活动中，因押金返还、住房维修、住房腾退等产生纠纷的，由出租人和承租人协商解决；协商不成的，可以依法申请调解、仲裁或者提起诉讼。
  chapter: 第五章　监督管理
  effective_date: '2025-09-15'
  source_url: https://flk.npc.gov.cn/detail?id=ff808181983198da01983f9ff1be5b2c
- law_name: 中华人民共和国消费者权益保护法
  law_short: 消费者权益保护法
  article_no: 第二十三条
  article_num: 23
  content: |-
    第二十三条　经营者应当保证在正常使用商品或者接受服务的情况下其提供的商品或者服务应当具有的质量、性能、用途和有效期限；但消费者在购买该商品或者接受该服务前已经知道其存在瑕疵，且存在该瑕疵不违反法律强制性规定的除外。
    经营者以广告、产品说明、实物样品或者其他方式表明商品或者服务的质量状况的，应当保证其提供的商品或者服务的实际质量与表明的质量状况相符。
    经营者提供的机动车、计算机、电视机、电冰箱、空调器、洗衣机等耐用商品或者装饰装修等服务，消费者自接受商品或者服务之日起六个月内发现瑕疵，发生争议的，由经营者承担有关瑕疵的举证责任。
  chapter: 第三章　经营者的义务
  effective_date: '2014-03-15'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf7670606ef
- law_name: 中华人民共和国消费者权益保护法
  law_short: 消费者权益保护法
  article_no: 第二十四条
  article_num: 24
  content: |-
    第二十四条　经营者提供的商品或者服务不符合质量要求的，消费者可以依照国家规定、当事人约定退货，或者要求经营者履行更换、修理等义务。没有国家规定和当事人约定的，消费者可以自收到商品之日起七日内退货；七日后符合法定解除合同条件的，消费者可以及时退货，不符合法定解除合同条件的，可以要求经营者履行更换、修理等义务。
    依照前款规定进行退货、更换、修理的，经营者应当承担运输等必要费用。
  chapter: 第三章　经营者的义务
  effective_date: '2014-03-15'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf7670606ef
- law_name: 中华人民共和国消费者权益保护法
  law_short: 消费者权益保护法
  article_no: 第二十五条
  article_num: 25
  content: |-
    第二十五条　经营者采用网络、电视、电话、邮购等方式销售商品，消费者有权自收到商品之日起七日内退货，且无需说明理由，但下列商品除外：
    （一）消费者定作的；
    （二）鲜活易腐的；
    （三）在线下载或者消费者拆封的音像制品、计算机软件等数字化商品；
    （四）交付的报纸、期刊。
    除前款所列商品外，其他根据商品性质并经消费者在购买时确认不宜退货的商品，不适用无理由退货。
    消费者退货的商品应当完好。经营者应当自收到退回商品之日起七日内返还消费者支付的商品价款。退回商品的运费由消费者承担；经营者和消费者另有约定的，按照约定。
  chapter: 第三章　经营者的义务
  effective_date: '2014-03-15'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf7670606ef
- law_name: 中华人民共和国消费者权益保护法
  law_short: 消费者权益保护法
  article_no: 第二十六条
  article_num: 26
  content: |-
    第二十六条　经营者在经营活动中使用格式条款的，应当以显著方式提请消费者注意商品或者服务的数量和质量、价款或者费用、履行期限和方式、安全注意事项和风险警示、售后服务、民事责任等与消费者有重大利害关系的内容，并按照消费者的要求予以说明。
    经营者不得以格式条款、通知、声明、店堂告示等方式，作出排除或者限制消费者权利、减轻或者免除经营者责任、加重消费者责任等对消费者不公平、不合理的规定，不得利用格式条款并借助技术手段强制交易。
    格式条款、通知、声明、店堂告示等含有前款所列内容的，其内容无效。
  chapter: 第三章　经营者的义务
  effective_date: '2014-03-15'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf7670606ef
- law_name: 中华人民共和国消费者权益保护法
  law_short: 消费者权益保护法
  article_no: 第三十九条
  article_num: 39
  content: |-
    第三十九条　消费者和经营者发生消费者权益争议的，可以通过下列途径解决：
    （一）与经营者协商和解；
    （二）请求消费者协会或者依法成立的其他调解组织调解；
    （三）向有关行政部门投诉；
    （四）根据与经营者达成的仲裁协议提请仲裁机构仲裁；
    （五）向人民法院提起诉讼。
  chapter: 第六章　争议的解决
  effective_date: '2014-03-15'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf7670606ef
- law_name: 中华人民共和国消费者权益保护法
  law_short: 消费者权益保护法
  article_no: 第四十四条
  article_num: 44
  content: |-
    第四十四条　消费者通过网络交易平台购买商品或者接受服务，其合法权益受到损害的，可以向销售者或者服务者要求赔偿。网络交易平台提供者不能提供销售者或者服务者的真实名称、地址和有效联系方式的，消费者也可以向网络交易平台提供者要求赔偿；网络交易平台提供者作出更有利于消费者的承诺的，应当履行承诺。网络交易平台提供者赔偿后，有权向销售者或者服务者追偿。
    网络交易平台提供者明知或者应知销售者或者服务者利用其平台侵害消费者合法权益，未采取必要措施的，依法与该销售者或者服务者承担连带责任。
  chapter: 第六章　争议的解决
  effective_date: '2014-03-15'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf7670606ef
- law_name: 中华人民共和国消费者权益保护法
  law_short: 消费者权益保护法
  article_no: 第五十三条
  article_num: 53
  content: |-
    第五十三条　经营者以预收款方式提供商品或者服务的，应当按照约定提供。未按照约定提供的，应当按照消费者的要求履行约定或者退回预付款；并应当承担预付款的利息、消费者必须支付的合理费用。
  chapter: 第七章　法律责任
  effective_date: '2014-03-15'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf7670606ef
- law_name: 中华人民共和国消费者权益保护法
  law_short: 消费者权益保护法
  article_no: 第五十五条
  article_num: 55
  content: |-
    第五十五条　经营者提供商品或者服务有欺诈行为的，应当按照消费者的要求增加赔偿其受到的损失，增加赔偿的金额为消费者购买商品的价款或者接受服务的费用的三倍；增加赔偿的金额不足五百元的，为五百元。法律另有规定的，依照其规定。
    经营者明知商品或者服务存在缺陷，仍然向消费者提供，造成消费者或者其他受害人死亡或者健康严重损害的，受害人有权要求经营者依照本法第四十九条、第五十一条等法律规定赔偿损失，并有权要求所受损失二倍以下的惩罚性赔偿。
  chapter: 第七章　法律责任
  effective_date: '2014-03-15'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf7670606ef
- law_name: 中华人民共和国消费者权益保护法实施条例
  law_short: 消费者权益保护法实施条例
  article_no: 第十条
  article_num: 10
  content: |-
    第十条　经营者应当按照国家有关规定，以显著方式标明商品的品名、价格和计价单位或者服务的项目、内容、价格和计价方法等信息，做到价签价目齐全、内容真实准确、标识清晰醒目。
    经营者采取自动展期、自动续费等方式提供服务的，应当在消费者接受服务前和自动展期、自动续费等日期前，以显著方式提请消费者注意。
  chapter: 第二章　消费者的权利和经营者的义务
  effective_date: '2024-07-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff808181927f09310192c2f4cd777281
- law_name: 中华人民共和国消费者权益保护法实施条例
  law_short: 消费者权益保护法实施条例
  article_no: 第十七条
  article_num: 17
  content: |-
    第十七条　经营者使用格式条款的，应当遵守消费者权益保护法第二十六条的规定。经营者不得利用格式条款不合理地免除或者减轻其责任、加重消费者的责任或者限制消费者依法变更或者解除合同、选择诉讼或者仲裁解决消费争议、选择其他经营者的商品或者服务等权利。
  chapter: 第二章　消费者的权利和经营者的义务
  effective_date: '2024-07-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff808181927f09310192c2f4cd777281
- law_name: 中华人民共和国消费者权益保护法实施条例
  law_short: 消费者权益保护法实施条例
  article_no: 第十九条
  article_num: 19
  content: |-
    第十九条　经营者通过网络、电视、电话、邮购等方式销售商品的，应当遵守消费者权益保护法第二十五条规定，不得擅自扩大不适用无理由退货的商品范围。
    经营者应当以显著方式对不适用无理由退货的商品进行标注，提示消费者在购买时进行确认，不得将不适用无理由退货作为消费者默认同意的选项。未经消费者确认，经营者不得拒绝无理由退货。
    消费者退货的商品应当完好。消费者基于查验需要打开商品包装，或者为确认商品的品质和功能进行合理调试而不影响商品原有品质、功能和外观的，经营者应当予以退货。
    消费者无理由退货应当遵循诚实信用原则，不得利用无理由退货规则损害经营者和其他消费者的合法权益。
  chapter: 第二章　消费者的权利和经营者的义务
  effective_date: '2024-07-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff808181927f09310192c2f4cd777281
- law_name: 中华人民共和国消费者权益保护法实施条例
  law_short: 消费者权益保护法实施条例
  article_no: 第二十二条
  article_num: 22
  content: |-
    第二十二条　经营者以收取预付款方式提供商品或者服务的，应当与消费者订立书面合同，约定商品或者服务的具体内容、价款或者费用、预付款退还方式、违约责任等事项。
    经营者收取预付款后，应当按照与消费者的约定提供商品或者服务，不得降低商品或者服务质量，不得任意加价。经营者未按照约定提供商品或者服务的，应当按照消费者的要求履行约定或者退还预付款。
    经营者出现重大经营风险，有可能影响经营者按照合同约定或者交易习惯正常提供商品或者服务的，应当停止收取预付款。经营者决定停业或者迁移服务场所的，应当提前告知消费者，并履行本条例第二十一条规定的义务。消费者依照国家有关规定或者合同约定，有权要求经营者继续履行提供商品或者服务的义务，或者要求退还未消费的预付款余额。
  chapter: 第二章　消费者的权利和经营者的义务
  effective_date: '2024-07-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff808181927f09310192c2f4cd777281
- law_name: 中华人民共和国消费者权益保护法实施条例
  law_short: 消费者权益保护法实施条例
  article_no: 第四十九条
  article_num: 49
  content: |-
    第四十九条　经营者提供商品或者服务有欺诈行为的，消费者有权根据消费者权益保护法第五十五条第一款的规定要求经营者予以赔偿。但是，商品或者服务的标签标识、说明书、宣传材料等存在不影响商品或者服务质量且不会对消费者造成误导的瑕疵的除外。
    通过夹带、掉包、造假、篡改商品生产日期、捏造事实等方式骗取经营者的赔偿或者对经营者进行敲诈勒索的，不适用消费者权益保护法第五十五条第一款的规定，依照《中华人民共和国治安管理处罚法》等有关法律、法规处理；构成犯罪的，依法追究刑事责任。
  chapter: 第六章　法律责任
  effective_date: '2024-07-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff808181927f09310192c2f4cd777281
- law_name: 中华人民共和国电子商务法
  law_short: 电子商务法
  article_no: 第十九条
  article_num: 19
  content: |-
    第十九条　电子商务经营者搭售商品或者服务，应当以显著方式提请消费者注意，不得将搭售商品或者服务作为默认同意的选项。
  chapter: 第二章　电子商务经营者 / 第一节　一般规定
  effective_date: '2019-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf8af050b81
- law_name: 中华人民共和国电子商务法
  law_short: 电子商务法
  article_no: 第三十八条
  article_num: 38
  content: |-
    第三十八条　电子商务平台经营者知道或者应当知道平台内经营者销售的商品或者提供的服务不符合保障人身、财产安全的要求，或者有其他侵害消费者合法权益行为，未采取必要措施的，依法与该平台内经营者承担连带责任。
    对关系消费者生命健康的商品或者服务，电子商务平台经营者对平台内经营者的资质资格未尽到审核义务，或者对消费者未尽到安全保障义务，造成消费者损害的，依法承担相应的责任。
  chapter: 第二章　电子商务经营者 / 第二节　电子商务平台经营者
  effective_date: '2019-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf8af050b81
- law_name: 中华人民共和国电子商务法
  law_short: 电子商务法
  article_no: 第四十九条
  article_num: 49
  content: |-
    第四十九条　电子商务经营者发布的商品或者服务信息符合要约条件的，用户选择该商品或者服务并提交订单成功，合同成立。当事人另有约定的，从其约定。
    电子商务经营者不得以格式条款等方式约定消费者支付价款后合同不成立；格式条款等含有该内容的，其内容无效。
  chapter: 第三章　电子商务合同的订立与履行
  effective_date: '2019-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf8af050b81
- law_name: 中华人民共和国电子商务法
  law_short: 电子商务法
  article_no: 第六十一条
  article_num: 61
  content: |-
    第六十一条　消费者在电子商务平台购买商品或者接受服务，与平台内经营者发生争议时，电子商务平台经营者应当积极协助消费者维护合法权益。
  chapter: 第四章　电子商务争议解决
  effective_date: '2019-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf8af050b81
- law_name: 中华人民共和国产品质量法
  law_short: 产品质量法
  article_no: 第三十九条
  article_num: 39
  content: |-
    第三十九条　销售者销售产品，不得掺杂、掺假，不得以假充真、以次充好，不得以不合格产品冒充合格产品。
  chapter: 第三章　生产者、销售者的产品质量责任和义务 / 第二节　销售者的产品质量责任和义务
  effective_date: '2018-12-29'
  source_url: https://flk.npc.gov.cn/detail?id=ff8080816f135f46016f1d6dfd7614d3
- law_name: 中华人民共和国产品质量法
  law_short: 产品质量法
  article_no: 第四十条
  article_num: 40
  content: |-
    第四十条　售出的产品有下列情形之一的，销售者应当负责修理、更换、退货；给购买产品的消费者造成损失的，销售者应当赔偿损失：
    （一）不具备产品应当具备的使用性能而事先未作说明的；
    （二）不符合在产品或者其包装上注明采用的产品标准的；
    （三）不符合以产品说明、实物样品等方式表明的质量状况的。
    销售者依照前款规定负责修理、更换、退货、赔偿损失后，属于生产者的责任或者属于向销售者提供产品的其他销售者（以下简称供货者）的责任的，销售者有权向生产者、供货者追偿。
    销售者未按照第一款规定给予修理、更换、退货或者赔偿损失的，由市场监督管理部门责令改正。
    生产者之间，销售者之间，生产者与销售者之间订立的买卖合同、承揽合同有不同约定的，合同当事人按照合同约定执行。
  chapter: 第四章　损害赔偿
  effective_date: '2018-12-29'
  source_url: https://flk.npc.gov.cn/detail?id=ff8080816f135f46016f1d6dfd7614d3
- law_name: 中华人民共和国产品质量法
  law_short: 产品质量法
  article_no: 第五十条
  article_num: 50
  content: |-
    第五十条　在产品中掺杂、掺假，以假充真，以次充好，或者以不合格产品冒充合格产品的，责令停止生产、销售，没收违法生产、销售的产品，并处违法生产、销售产品货值金额百分之五十以上三倍以下的罚款；有违法所得的，并处没收违法所得；情节严重的，吊销营业执照；构成犯罪的，依法追究刑事责任。
  chapter: 第五章　罚　　则
  effective_date: '2018-12-29'
  source_url: https://flk.npc.gov.cn/detail?id=ff8080816f135f46016f1d6dfd7614d3
- law_name: 中华人民共和国劳动法
  law_short: 劳动法
  article_no: 第四十一条
  article_num: 41
  content: |-
    第四十一条　用人单位由于生产经营需要，经与工会和劳动者协商后可以延长工作时间，一般每日不得超过一小时；因特殊原因需要延长工作时间的，在保障劳动者身体健康的条件下延长工作时间每日不得超过三小时，但是每月不得超过三十六小时。
  chapter: 第四章　工作时间和休息休假
  effective_date: '2018-12-29'
  source_url: https://flk.npc.gov.cn/detail?id=ff8080816f135f46016f20f16ee11737
- law_name: 中华人民共和国劳动法
  law_short: 劳动法
  article_no: 第四十四条
  article_num: 44
  content: |-
    第四十四条　有下列情形之一的，用人单位应当按照下列标准支付高于劳动者正常工作时间工资的工资报酬：
    （一）安排劳动者延长工作时间的，支付不低于工资的百分之一百五十的工资报酬；
    （二）休息日安排劳动者工作又不能安排补休的，支付不低于工资的百分之二百的工资报酬；
    （三）法定休假日安排劳动者工作的，支付不低于工资的百分之三百的工资报酬。
  chapter: 第四章　工作时间和休息休假
  effective_date: '2018-12-29'
  source_url: https://flk.npc.gov.cn/detail?id=ff8080816f135f46016f20f16ee11737
- law_name: 中华人民共和国劳动法
  law_short: 劳动法
  article_no: 第五十条
  article_num: 50
  content: |-
    第五十条　工资应当以货币形式按月支付给劳动者本人。不得克扣或者无故拖欠劳动者的工资。
  chapter: 第五章　工　　资
  effective_date: '2018-12-29'
  source_url: https://flk.npc.gov.cn/detail?id=ff8080816f135f46016f20f16ee11737
- law_name: 中华人民共和国劳动法
  law_short: 劳动法
  article_no: 第九十一条
  article_num: 91
  content: |-
    第九十一条　用人单位有下列侵害劳动者合法权益情形之一的，由劳动行政部门责令支付劳动者的工资报酬、经济补偿，并可以责令支付赔偿金：
    （一）克扣或者无故拖欠劳动者工资的；
    （二）拒不支付劳动者延长工作时间工资报酬的；
    （三）低于当地最低工资标准支付劳动者工资的；
    （四）解除劳动合同后，未依照本法规定给予劳动者经济补偿的。
  chapter: 第十二章　法律责任
  effective_date: '2018-12-29'
  source_url: https://flk.npc.gov.cn/detail?id=ff8080816f135f46016f20f16ee11737
- law_name: 中华人民共和国劳动合同法
  law_short: 劳动合同法
  article_no: 第三十条
  article_num: 30
  content: |-
    第三十条　用人单位应当按照劳动合同约定和国家规定，向劳动者及时足额支付劳动报酬。
    用人单位拖欠或者未足额支付劳动报酬的，劳动者可以依法向当地人民法院申请支付令，人民法院应当依法发出支付令。
  chapter: 第三章　劳动合同的履行和变更
  effective_date: '2013-07-01'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf74d7106b3
- law_name: 中华人民共和国劳动合同法
  law_short: 劳动合同法
  article_no: 第三十一条
  article_num: 31
  content: |-
    第三十一条　用人单位应当严格执行劳动定额标准，不得强迫或者变相强迫劳动者加班。用人单位安排加班的，应当按照国家有关规定向劳动者支付加班费。
  chapter: 第三章　劳动合同的履行和变更
  effective_date: '2013-07-01'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf74d7106b3
- law_name: 中华人民共和国劳动合同法
  law_short: 劳动合同法
  article_no: 第三十八条
  article_num: 38
  content: |-
    第三十八条　用人单位有下列情形之一的，劳动者可以解除劳动合同：
    （一）未按照劳动合同约定提供劳动保护或者劳动条件的；
    （二）未及时足额支付劳动报酬的；
    （三）未依法为劳动者缴纳社会保险费的；
    （四）用人单位的规章制度违反法律、法规的规定，损害劳动者权益的；
    （五）因本法第二十六条第一款规定的情形致使劳动合同无效的；
    （六）法律、行政法规规定劳动者可以解除劳动合同的其他情形。
    用人单位以暴力、威胁或者非法限制人身自由的手段强迫劳动者劳动的，或者用人单位违章指挥、强令冒险作业危及劳动者人身安全的，劳动者可以立即解除劳动合同，不需事先告知用人单位。
  chapter: 第四章　劳动合同的解除和终止
  effective_date: '2013-07-01'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf74d7106b3
- law_name: 中华人民共和国劳动合同法
  law_short: 劳动合同法
  article_no: 第八十五条
  article_num: 85
  content: |-
    第八十五条　用人单位有下列情形之一的，由劳动行政部门责令限期支付劳动报酬、加班费或者经济补偿；劳动报酬低于当地最低工资标准的，应当支付其差额部分；逾期不支付的，责令用人单位按应付金额百分之五十以上百分之一百以下的标准向劳动者加付赔偿金：
    （一）未按照劳动合同的约定或者国家规定及时足额支付劳动者劳动报酬的；
    （二）低于当地最低工资标准支付劳动者工资的；
    （三）安排加班不支付加班费的；
    （四）解除或者终止劳动合同，未依照本法规定向劳动者支付经济补偿的。
  chapter: 第七章　法律责任
  effective_date: '2013-07-01'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf74d7106b3
- law_name: 中华人民共和国劳动争议调解仲裁法
  law_short: 劳动争议调解仲裁法
  article_no: 第二条
  article_num: 2
  content: |-
    第二条　中华人民共和国境内的用人单位与劳动者发生的下列劳动争议，适用本法：
    （一）因确认劳动关系发生的争议；
    （二）因订立、履行、变更、解除和终止劳动合同发生的争议；
    （三）因除名、辞退和辞职、离职发生的争议；
    （四）因工作时间、休息休假、社会保险、福利、培训以及劳动保护发生的争议；
    （五）因劳动报酬、工伤医疗费、经济补偿或者赔偿金等发生的争议；
    （六）法律、法规规定的其他劳动争议。
  chapter: 第一章　总　　则
  effective_date: '2008-05-01'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf64f28039d
- law_name: 中华人民共和国劳动争议调解仲裁法
  law_short: 劳动争议调解仲裁法
  article_no: 第五条
  article_num: 5
  content: |-
    第五条　发生劳动争议，当事人不愿协商、协商不成或者达成和解协议后不履行的，可以向调解组织申请调解；不愿调解、调解不成或者达成调解协议后不履行的，可以向劳动争议仲裁委员会申请仲裁；对仲裁裁决不服的，除本法另有规定的外，可以向人民法院提起诉讼。
  chapter: 第一章　总　　则
  effective_date: '2008-05-01'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf64f28039d
- law_name: 中华人民共和国劳动争议调解仲裁法
  law_short: 劳动争议调解仲裁法
  article_no: 第六条
  article_num: 6
  content: |-
    第六条　发生劳动争议，当事人对自己提出的主张，有责任提供证据。与争议事项有关的证据属于用人单位掌握管理的，用人单位应当提供；用人单位不提供的，应当承担不利后果。
  chapter: 第一章　总　　则
  effective_date: '2008-05-01'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf64f28039d
- law_name: 中华人民共和国劳动争议调解仲裁法
  law_short: 劳动争议调解仲裁法
  article_no: 第九条
  article_num: 9
  content: |-
    第九条　用人单位违反国家规定，拖欠或者未足额支付劳动报酬，或者拖欠工伤医疗费、经济补偿或者赔偿金的，劳动者可以向劳动行政部门投诉，劳动行政部门应当依法处理。
  chapter: 第一章　总　　则
  effective_date: '2008-05-01'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf64f28039d
- law_name: 中华人民共和国劳动争议调解仲裁法
  law_short: 劳动争议调解仲裁法
  article_no: 第二十一条
  article_num: 21
  content: |-
    第二十一条　劳动争议仲裁委员会负责管辖本区域内发生的劳动争议。
    劳动争议由劳动合同履行地或者用人单位所在地的劳动争议仲裁委员会管辖。双方当事人分别向劳动合同履行地和用人单位所在地的劳动争议仲裁委员会申请仲裁的，由劳动合同履行地的劳动争议仲裁委员会管辖。
  chapter: 第三章　仲　　裁 / 第一节　一般规定
  effective_date: '2008-05-01'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf64f28039d
- law_name: 中华人民共和国劳动争议调解仲裁法
  law_short: 劳动争议调解仲裁法
  article_no: 第二十七条
  article_num: 27
  content: |-
    第二十七条　劳动争议申请仲裁的时效期间为一年。仲裁时效期间从当事人知道或者应当知道其权利被侵害之日起计算。
    前款规定的仲裁时效，因当事人一方向对方当事人主张权利，或者向有关部门请求权利救济，或者对方当事人同意履行义务而中断。从中断时起，仲裁时效期间重新计算。
    因不可抗力或者有其他正当理由，当事人不能在本条第一款规定的仲裁时效期间申请仲裁的，仲裁时效中止。从中止时效的原因消除之日起，仲裁时效期间继续计算。
    劳动关系存续期间因拖欠劳动报酬发生争议的，劳动者申请仲裁不受本条第一款规定的仲裁时效期间的限制；但是，劳动关系终止的，应当自劳动关系终止之日起一年内提出。
  chapter: 第三章　仲　　裁 / 第二节　申请和受理
  effective_date: '2008-05-01'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf64f28039d
- law_name: 中华人民共和国劳动争议调解仲裁法
  law_short: 劳动争议调解仲裁法
  article_no: 第二十八条
  article_num: 28
  content: |-
    第二十八条　申请人申请仲裁应当提交书面仲裁申请，并按照被申请人人数提交副本。
    仲裁申请书应当载明下列事项：
    （一）劳动者的姓名、性别、年龄、职业、工作单位和住所，用人单位的名称、住所和法定代表人或者主要负责人的姓名、职务；
    （二）仲裁请求和所根据的事实、理由；
    （三）证据和证据来源、证人姓名和住所。
    书写仲裁申请确有困难的，可以口头申请，由劳动争议仲裁委员会记入笔录，并告知对方当事人。
  chapter: 第三章　仲　　裁 / 第二节　申请和受理
  effective_date: '2008-05-01'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf64f28039d
- law_name: 中华人民共和国劳动争议调解仲裁法
  law_short: 劳动争议调解仲裁法
  article_no: 第三十九条
  article_num: 39
  content: |-
    第三十九条　当事人提供的证据经查证属实的，仲裁庭应当将其作为认定事实的根据。
    劳动者无法提供由用人单位掌握管理的与仲裁请求有关的证据，仲裁庭可以要求用人单位在指定期限内提供。用人单位在指定期限内不提供的，应当承担不利后果。
  chapter: 第三章　仲　　裁 / 第三节　开庭和裁决
  effective_date: '2008-05-01'
  source_url: https://flk.npc.gov.cn/detail?id=2c909fdd678bf17901678bf64f28039d
- law_name: 最高人民法院关于审理劳动争议案件适用法律问题的解释（一）
  law_short: 劳动争议司法解释（一）
  article_no: 第四十二条
  article_num: 42
  content: |-
    第四十二条　劳动者主张加班费的，应当就加班事实的存在承担举证责任。但劳动者有证据证明用人单位掌握加班事实存在的证据，用人单位不提供的，由用人单位承担不利后果。
  chapter: null
  effective_date: '2021-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff80808177e75f88017800739d621b12
- law_name: 中华人民共和国民事诉讼法
  law_short: 民事诉讼法
  article_no: 第一百六十五条
  article_num: 165
  content: |-
    第一百六十五条　基层人民法院和它派出的法庭审理事实清楚、权利义务关系明确、争议不大的简单金钱给付民事案件，标的额为各省、自治区、直辖市上年度就业人员年平均工资百分之五十以下的，适用小额诉讼的程序审理，实行一审终审。
    基层人民法院和它派出的法庭审理前款规定的民事案件，标的额超过各省、自治区、直辖市上年度就业人员年平均工资百分之五十但在二倍以下的，当事人双方也可以约定适用小额诉讼的程序。
  chapter: 第十三章　简易程序
  effective_date: '2024-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff8081818a21dc13018b425303b7086d
- law_name: 中华人民共和国民事诉讼法
  law_short: 民事诉讼法
  article_no: 第一百六十六条
  article_num: 166
  content: |-
    第一百六十六条　人民法院审理下列民事案件，不适用小额诉讼的程序：
    （一）人身关系、财产确权案件；
    （二）涉外案件；
    （三）需要评估、鉴定或者对诉前评估、鉴定结果有异议的案件；
    （四）一方当事人下落不明的案件；
    （五）当事人提出反诉的案件；
    （六）其他不宜适用小额诉讼的程序审理的案件。
  chapter: 第十三章　简易程序
  effective_date: '2024-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff8081818a21dc13018b425303b7086d
- law_name: 中华人民共和国民事诉讼法
  law_short: 民事诉讼法
  article_no: 第一百六十八条
  article_num: 168
  content: |-
    第一百六十八条　人民法院适用小额诉讼的程序审理案件，应当在立案之日起两个月内审结。有特殊情况需要延长的，经本院院长批准，可以延长一个月。
  chapter: 第十三章　简易程序
  effective_date: '2024-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff8081818a21dc13018b425303b7086d
- law_name: 中华人民共和国民事诉讼法
  law_short: 民事诉讼法
  article_no: 第一百六十九条
  article_num: 169
  content: |-
    第一百六十九条　人民法院在审理过程中，发现案件不宜适用小额诉讼的程序的，应当适用简易程序的其他规定审理或者裁定转为普通程序。
    当事人认为案件适用小额诉讼的程序审理违反法律规定的，可以向人民法院提出异议。人民法院对当事人提出的异议应当审查，异议成立的，应当适用简易程序的其他规定审理或者裁定转为普通程序；异议不成立的，裁定驳回。
  chapter: 第十三章　简易程序
  effective_date: '2024-01-01'
  source_url: https://flk.npc.gov.cn/detail?id=ff8081818a21dc13018b425303b7086d
