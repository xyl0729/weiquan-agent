services:
  postgres-test:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: weiquan_test
      POSTGRES_USER: weiquan_test
      POSTGRES_PASSWORD: local-integration-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weiquan_test -d weiquan_test"]
      interval: 2s
      timeout: 2s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
