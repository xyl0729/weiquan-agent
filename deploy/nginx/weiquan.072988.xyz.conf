server {
    listen 80;
    listen [::]:80;
    server_name weiquan.072988.xyz;

    access_log /var/log/nginx/weiquan.access.log;
    error_log /var/log/nginx/weiquan.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name weiquan.072988.xyz;

    ssl_certificate /etc/letsencrypt/live/weiquan.072988.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weiquan.072988.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WEIQUAN_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/weiquan.access.log;
    error_log /var/log/nginx/weiquan.error.log warn;
    client_max_body_size 11m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /internal {
        return 404;
    }

    location ^~ /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering on;
        proxy_buffering off;
    }
}
