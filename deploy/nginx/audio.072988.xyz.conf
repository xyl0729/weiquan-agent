server {
    listen 80;
    listen [::]:80;
    server_name audio.072988.xyz;

    access_log /var/log/nginx/audio.access.log;
    error_log /var/log/nginx/audio.error.log warn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name audio.072988.xyz;

    ssl_certificate /etc/letsencrypt/live/audio.072988.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/audio.072988.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AUDIO_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/audio;
    autoindex off;
    access_log /var/log/nginx/audio.access.log;
    error_log /var/log/nginx/audio.error.log warn;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ~* \.mp3$ {
        limit_except GET {
            deny all;
        }
        types {
            audio/mpeg mp3;
        }
        default_type application/octet-stream;
        try_files $uri =404;
        disable_symlinks if_not_owner from=$document_root;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        return 404;
    }
}
